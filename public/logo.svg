<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Yellow background -->
  <rect width="200" height="200" fill="#F5C200"/>

  <!-- Left horn: starts center-top, sweeps outward/down, tip curls upward -->
  <path d="M 100 52
           C 84 44, 52 50, 36 78
           C 20 106, 26 142, 52 156
           C 64 163, 80 161, 89 151
           C 98 140, 96 126, 84 118
           C 72 110, 56 115, 53 128
           C 50 138, 57 148, 67 150"
        fill="none" stroke="#111111" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right horn: mirror of left -->
  <path d="M 100 52
           C 116 44, 148 50, 164 78
           C 180 106, 174 142, 148 156
           C 136 163, 120 161, 111 151
           C 102 140, 104 126, 116 118
           C 128 110, 144 115, 147 128
           C 150 138, 143 148, 133 150"
        fill="none" stroke="#111111" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mustache: two arched bumps below horns -->
  <path d="M 66 170 Q 78 156, 93 168 Q 100 174, 107 168 Q 122 156, 134 170"
        fill="none" stroke="#111111" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
